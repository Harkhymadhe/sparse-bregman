[project]
name = "sparse-bregman"
version = "0.1.0"
description = "A repo for implementing FoldingNet for 3D point clouds from scratch and observing the effect of the Bregman learning framework on it."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    'black>=25.1.0',
    'h5py>=3.12',
    'hydra-core>=1.3.2',
    'isort==9.0.2',
    'loguru==0.7.3',
    'matplotlib>3.5',
    'nvtx==0.2.15',
    'pillow>=11.1.0',
    'pretrained-backbones-unet==0.0.1',
    'rich>=13.9.4',
    'ruff==0.17.5',
    'scikit-learn>=1.6.1',
    'torch>=2.6.0',
    'torchinfo==1.8.0',
    'torchvision>=0.21',
    'torch-geometric>2.4'
]

